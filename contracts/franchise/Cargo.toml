[package]
name = "franchise"
version = "0.1.0"
edition = "2021"
description = "Franchise: NFTs that own an AI agent's NEAR account"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { workspace = true }
near-contract-standards = { workspace = true }

[dev-dependencies]
near-sdk = { workspace = true, features = ["unit-testing"] }
